name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend lint + type + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"        # matches render.yaml runtime
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app.py services/ scripts/ tests/

      - name: Legal documents are built and up to date
        run: python scripts/build_legal.py --check

      - name: Type check (mypy, non-blocking report)
        continue-on-error: true
        run: mypy services/ --ignore-missing-imports || true

      - name: Install Chromium for browser tests
        run: python -m playwright install --with-deps chromium

      - name: Unit + integration + browser tests
        env:
          FLASK_ENV: development
        run: |
          set +e
          pytest -q --junitxml=reports/pytest.xml
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::Pytest failed. The JUnit failure details follow."
            cat reports/pytest.xml || true
          fi
          exit "$status"

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: reports/pytest.xml

  sql:
    name: Migration 0007 on real PostgreSQL (PGlite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
        working-directory: tests/sql
      - run: npm test
        working-directory: tests/sql
      - name: Publish which migration test failed
        if: failure()
        working-directory: tests/sql
        # Action logs are only readable by someone signed in to the repo, so a
        # red SQL job tells an unauthenticated caller nothing. Annotations are
        # served by the public commits API, which is how this failure gets
        # diagnosed at all. Each file builds its own in-process PGlite, so
        # re-running them here in alphabetical order is safe.
        run: |
          echo "node $(node -v), pglite $(node -p "require('@electric-sql/pglite/package.json').version")"
          for f in *.test.mjs; do
            if ! node "$f" >"$RUNNER_TEMP/out.log" 2>&1; then
              detail="$(tr '\r\n' '  ' <"$RUNNER_TEMP/out.log" | tail -c 700)"
              echo "::error::SQL test $f failed: $detail"
            fi
          done

  # NOTE: SQL tests for migrations 0001-0006 and Android .aab builds need live credentials
  # (Supabase DB, Android SDK/signing) and are documented as external steps in
  # docs/IMPLEMENTATION_STATUS.md and docs/PLAY_STORE_RELEASE.md. They are
  # intentionally NOT faked here. (SQL tests exist only for migration 0007 so far.)
  # (older note) SQL migration tests and Android .aab builds need live credentials
  # (Supabase DB, Android SDK/signing) and are documented as external steps in
  # docs/IMPLEMENTATION_STATUS.md and docs/PLAY_STORE_RELEASE.md. They are
  # intentionally NOT faked here.
