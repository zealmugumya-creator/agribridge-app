name: Build AgriBridge APK
on:
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install npm packages
        run: npm install

      - name: Setup Android SDK
        run: |
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          mkdir -p $HOME/android/cmdline-tools
          unzip -q tools.zip -d $HOME/android/cmdline-tools
          mv $HOME/android/cmdline-tools/cmdline-tools $HOME/android/cmdline-tools/latest
          echo "ANDROID_HOME=$HOME/android" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android" >> $GITHUB_ENV
          echo "$HOME/android/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android/platform-tools" >> $GITHUB_PATH
          yes | $HOME/android/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1
          $HOME/android/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Download web app from Render and prepare assets
        run: |
          mkdir -p android/app/src/main/assets/public
          # Download the live app from Render
          wget -q "https://agribridge-1-og7a.onrender.com" -O android/app/src/main/assets/public/index.html
          echo "Downloaded index.html: $(wc -c < android/app/src/main/assets/public/index.html) bytes"
          # Create manifest.json
          cat > android/app/src/main/assets/public/manifest.json << 'MANIFEST'
          {"name":"AgriBridge","short_name":"AgriBridge","start_url":"/","display":"standalone","background_color":"#060f09","theme_color":"#1E5E3A"}
          MANIFEST
          # Create capacitor config
          cp capacitor.config.json android/app/src/main/assets/capacitor.config.json
          # Create plugins json
          echo '{"plugins":{}}' > android/app/src/main/assets/capacitor.plugins.json
          echo "Assets prepared:"
          ls android/app/src/main/assets/

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --stacktrace
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: agribridge-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
