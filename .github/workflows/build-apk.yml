name: Build AgriBridge APK
on:
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show repo structure
        run: find . -maxdepth 3 -name "package.json" -o -name "capacitor.config.json" | head -20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Find and install npm packages
        run: |
          if [ -f package.json ]; then
            echo "package.json found at root"
            npm install
          elif [ -f agribridge-app/package.json ]; then
            echo "package.json found in agribridge-app/"
            cd agribridge-app && npm install
          else
            echo "ERROR: package.json not found anywhere"
            find . -name "package.json" | head -10
            exit 1
          fi

      - name: Setup Android SDK
        run: |
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          mkdir -p $HOME/android/cmdline-tools
          unzip -q tools.zip -d $HOME/android/cmdline-tools
          mv $HOME/android/cmdline-tools/cmdline-tools $HOME/android/cmdline-tools/latest
          echo "ANDROID_HOME=$HOME/android" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android" >> $GITHUB_ENV
          echo "$HOME/android/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android/platform-tools" >> $GITHUB_PATH
          yes | $HOME/android/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1
          $HOME/android/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Find and run Capacitor sync
        run: |
          if [ -f package.json ]; then
            npx cap sync android
          else
            cd agribridge-app && npx cap sync android
          fi

      - name: Find and build APK
        run: |
          if [ -f android/gradlew ]; then
            chmod +x android/gradlew
            cd android && ./gradlew assembleDebug --stacktrace
          else
            chmod +x agribridge-app/android/gradlew
            cd agribridge-app/android && ./gradlew assembleDebug --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: agribridge-apk
          path: |
            **/app-debug.apk
          retention-days: 30
