name: Build AgriBridge APK
on:
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show repo contents
        run: |
          echo "=== ROOT ==="
          ls -la
          echo "=== ANDROID FOLDER ==="
          ls android/ 2>/dev/null || echo "NO android/ folder"
          echo "=== ALL GRADLEW FILES ==="
          find . -name "gradlew" 2>/dev/null || echo "No gradlew found"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install npm packages
        run: npm install

      - name: Setup Android SDK
        run: |
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          mkdir -p $HOME/android/cmdline-tools
          unzip -q tools.zip -d $HOME/android/cmdline-tools
          mv $HOME/android/cmdline-tools/cmdline-tools $HOME/android/cmdline-tools/latest
          echo "ANDROID_HOME=$HOME/android" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android" >> $GITHUB_ENV
          echo "$HOME/android/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android/platform-tools" >> $GITHUB_PATH
          yes | $HOME/android/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1
          $HOME/android/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Generate Android project
        run: |
          # Remove any partial android folder
          rm -rf android
          # Add fresh android platform
          npx cap add android
          echo "=== AFTER CAP ADD ==="
          ls android/
          ls android/gradlew && echo "gradlew EXISTS" || echo "gradlew MISSING"
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Download latest web app from Render
        run: |
          mkdir -p android/app/src/main/assets/public
          wget -q "https://agribridge-1-og7a.onrender.com" -O android/app/src/main/assets/public/index.html
          cp capacitor.config.json android/app/src/main/assets/capacitor.config.json
          echo '{"plugins":{}}' > android/app/src/main/assets/capacitor.plugins.json
          echo "Assets ready: $(wc -c < android/app/src/main/assets/public/index.html) bytes"

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: agribridge-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
